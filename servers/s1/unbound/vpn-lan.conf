server:
    interface: 10.9.0.1
    interface: 127.0.0.1
    outgoing-interface: 10.10.0.1
    port: 53
    access-control: 127.0.0.0/8 allow
    access-control: 10.9.0.0/24 allow
    access-control: 0.0.0.0/0 refuse
    do-daemonize: yes
    username: unbound
    directory: /var/lib/unbound
    chroot: ""
    num-threads: 1
    msg-cache-size: 24m
    rrset-cache-size: 48m
    cache-min-ttl: 60
    cache-max-ttl: 86400
    prefetch: yes
    harden-dnssec-stripped: yes
    hide-identity: yes
    hide-version: yes
    private-address: 10.9.0.0/24
    private-address: 10.10.0.0/24
